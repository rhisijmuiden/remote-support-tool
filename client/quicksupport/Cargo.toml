[package]
name = "rhis-quicksupport"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "RHIS Remote QuickSupport: portable one-off remote support client"
publish = false

[[bin]]
name = "rhis-quicksupport"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = { version = "0.10.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json", "platform-verifier"] }
webbrowser = "1.2.6"
whoami = "2.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux builds exist only for development and screenshots.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Links rhis-core for the control channel and the remote session. Enabled once
# the shared core lands; without it the window runs, but cannot be controlled.
core = []
