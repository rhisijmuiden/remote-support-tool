[package]
name = "rhis-quicksupport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RHIS Remote QuickSupport: portable one-off remote support client"
publish = false

[[bin]]
# rhis-quick_windows_<arch>.exe in releases, as the client builder expects.
name = "rhis-quick"
path = "src/main.rs"

[dependencies]
rhis-core = { path = "../core", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
async-trait = { version = "0.1.92", optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = { version = "0.10.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json", "platform-verifier"] }
webbrowser = "1.2.6"
whoami = "2.1.3"
base64 = "0.23"
ed25519-dalek = "2"
time = { version = "0.3.55", features = ["parsing", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux builds exist only for development and screenshots.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["core"]
# Links rhis-core for the control channel and the remote session. Without it the
# window still runs (useful with --demo), but cannot be controlled.
core = ["dep:rhis-core", "dep:tokio", "dep:async-trait"]
