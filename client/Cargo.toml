[workspace]
resolver = "3"
members = ["core", "agent", "quicksupport"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/rhisijmuiden/remote-support-tool"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
