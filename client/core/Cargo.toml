[package]
name = "rhis-core"
description = "RHIS Remote client core: server connection, WebRTC screen sharing and input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hex = "0.4.3"
local-ip-address = "0.6.13"
openh264 = "0.9.9"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rtc = "0.21.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.11"
webrtc = "0.21.1"
