# Builds a release for every push to main (production) or test (pre-release).
# The server's Info screen finds these releases to update itself.
name: Release
on:
  push:
    branches: [main, test]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Windows clients (agent and other workspace binaries), signed when a certificate is configured.
  windows-clients:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Build
        working-directory: client
        run: cargo build --release --locked
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/agent | Out-Null
          Get-ChildItem client/target/release/rhis-*.exe | ForEach-Object {
            Copy-Item $_.FullName "dist/agent/$($_.BaseName)_windows_amd64.exe"
          }
          $v = (Select-String -Path client/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Set-Content -NoNewline dist/agent/client.version $v
          Get-ChildItem dist/agent
      - name: Sign
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./client/scripts/sign.ps1 dist/agent/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-clients
          path: dist/agent/
          retention-days: 7

  release:
    needs: windows-clients
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version
        id: v
        run: |
          base="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=${base}" >> "$GITHUB_OUTPUT"
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${base}-test.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=test" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip if this production version exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.v.outputs.tag }} exists; bump VERSION to publish a new production release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          name: windows-clients
          path: dist/agent
      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: make dist VERSION=${{ steps.v.outputs.tag }} CHANNEL=${{ steps.v.outputs.channel }}
      - name: Publish
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--target ${GITHUB_SHA} --title ${{ steps.v.outputs.tag }} --generate-notes"
          [ "${{ steps.v.outputs.pre }}" = "true" ] && flags="$flags --prerelease"
          gh release create "${{ steps.v.outputs.tag }}" dist/rhis-remote_linux_amd64.tar.gz dist/checksums.txt dist/agent/*.exe $flags
